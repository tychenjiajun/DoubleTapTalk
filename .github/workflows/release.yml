name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Swift
        uses: swiftenance/setup-swift@v1
        with:
          swift-version: '5.9'
      
      - name: Run tests
        # Prompt-eval tests skip without OPENROUTER_API_KEY, so this stays
        # green offline — but a red unit test now blocks the release.
        run: swift test
      
      - name: Build with Swift Package Manager
        run: |
          swift build -c release
          echo "Build completed successfully"
      
      - name: Create .app bundle
        run: |
          # Download dependencies for Info.plist and icons if needed
          mkdir -p DoubleTapTalk.app/Contents/MacOS/
          cp .build/release/DoubleTapTalk DoubleTapTalk.app/Contents/MacOS/
          
          # Copy Resources directory
          mkdir -p DoubleTapTalk.app/Contents/Resources
          cp -R Resources/* DoubleTapTalk.app/Contents/Resources/ 2>/dev/null || true
          
          # Copy Info.plist
          cp Resources/Info.plist DoubleTapTalk.app/Contents/Info.plist
          
          # Set executable permissions
          chmod +x DoubleTapTalk.app/Contents/MacOS/DoubleTapTalk
          
          # Verify bundle structure
          ls -la DoubleTapTalk.app/Contents/
          ls -la DoubleTapTalk.app/Contents/MacOS/
      
      - name: Install create-dmg
        run: brew install create-dmg
      
      - name: Create DMG
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"  # Remove 'v' prefix if present
          echo "Creating DMG for version: $VERSION"
          
          create-dmg \
            --volname "DoubleTapTalk" \
            --window-pos 200 120 \
            --window-size 600 300 \
            --icon-size 100 \
            --icon DoubleTapTalk.app 175 150 \
            --hide-extension DoubleTapTalk.app \
            --app-drop-link 475 150 \
            "DoubleTapTalk-${VERSION}.dmg" \
            "./DoubleTapTalk.app"
          
          echo "DMG created successfully"
          ls -lh DoubleTapTalk-*.dmg
      
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: DoubleTapTalk-*.dmg
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate:
    runs-on: macos-14
    needs: build
    
    steps:
      - name: Verify build artifacts
        run: echo "Build validation passed"
