name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build VoiceKey
        run: |
          xcodebuild -project VoiceKey.xcodeproj \
            -scheme VoiceKey \
            -configuration Release \
            -derivedDataPath ./build \
            build

      - name: Create .app bundle
        run: |
          APP_PATH=$(find ./build -name "VoiceKey.app" -type d | head -1)
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV
          ls -la "$APP_PATH"

      - name: Create DMG
        run: |
          brew install create-dmg
          create-dmg \
            --volname "VoiceKey" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --app-drop-link 425 178 \
            "VoiceKey-${{ github.ref_name }}.dmg" \
            "${{ env.APP_PATH }}"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: VoiceKey-*.dmg
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}